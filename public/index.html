<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="utf-8" />
  <meta http-equiv="X-UA-Compatible" content="IE=edge" />
  <meta name="referrer" content="no-referrer" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <link rel="icon" href="<%= BASE_URL %>favicon.ico" />
  <title>
    <%= htmlWebpackPlugin.options.title %>
  </title>

  <style>
    /* ---------------------------------------------------------------
       启动遮罩（boot splash）
       写在 index.html 里而不是 Vue 组件里：它必须早于 JS bundle 生效，
       在 Vue 挂载 + 首页数据回来之前盖住骨架屏。零依赖、零请求。
       所有选择器都以 #ypm-boot-splash 限定，避免污染应用全局样式。
       --------------------------------------------------------------- */

    #ypm-boot-splash {
      /* 强调色：默认 default，其余皮肤由 html[data-boot-accent] 覆盖 */
      --ypm-boot-rgb: 51, 94, 234;
      --ypm-boot-gradient: linear-gradient(135deg, #6b8dff 0%, #335eea 100%);

      /* 浅色 */
      --ypm-boot-bg: #ffffff;
      --ypm-boot-fg: #1f2129;
      --ypm-boot-track: rgba(31, 33, 41, 0.08);
      --ypm-boot-shadow-a: 0.45;

      position: fixed;
      top: 0;
      right: 0;
      bottom: 0;
      left: 0;
      z-index: 9999;
      display: flex;
      align-items: center;
      justify-content: center;
      /* 完全遮住底下的骨架屏，不用半透明 */
      background-color: var(--ypm-boot-bg);
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC',
        'Microsoft YaHei', sans-serif;
      -webkit-font-smoothing: antialiased;
      opacity: 1;
      transition: opacity 420ms cubic-bezier(0.4, 0, 1, 1);
    }

    /* 深色 */
    html[data-boot-theme='dark'] #ypm-boot-splash {
      --ypm-boot-bg: #222222;
      --ypm-boot-fg: #f2f3f7;
      --ypm-boot-track: rgba(255, 255, 255, 0.1);
      --ypm-boot-shadow-a: 0.3;
    }

    /* 皮肤：与 src/utils/common.js 的 themeColorPresets 对齐 */
    html[data-boot-accent='sunset'] #ypm-boot-splash {
      --ypm-boot-rgb: 221, 36, 118;
      --ypm-boot-gradient: linear-gradient(135deg, #ff512f 0%, #dd2476 100%);
    }

    html[data-boot-accent='ocean'] #ypm-boot-splash {
      --ypm-boot-rgb: 0, 114, 255;
      --ypm-boot-gradient: linear-gradient(135deg, #00c6ff 0%, #0072ff 100%);
    }

    html[data-boot-accent='forest'] #ypm-boot-splash {
      --ypm-boot-rgb: 86, 171, 47;
      --ypm-boot-gradient: linear-gradient(135deg, #56ab2f 0%, #a8e063 100%);
    }

    /* 中心光晕：质感的主要来源，6s 极慢呼吸。
       用负 margin 居中而不是 transform，把 transform 留给呼吸动画。 */
    #ypm-boot-splash .ypm-boot-glow {
      position: absolute;
      /* 对齐标记中心（标记 96px 高） */
      top: 48px;
      left: 50%;
      width: 420px;
      height: 420px;
      margin: -210px 0 0 -210px;
      border-radius: 50%;
      background-image: radial-gradient(
        circle,
        rgba(var(--ypm-boot-rgb), 0.12) 0%,
        rgba(var(--ypm-boot-rgb), 0) 70%
      );
      opacity: 0.55;
      pointer-events: none;
      animation: ypm-boot-breathe 6s ease-in-out infinite;
    }

    #ypm-boot-splash .ypm-boot-stack {
      position: relative;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    #ypm-boot-splash .ypm-boot-mark {
      /* 光晕是绝对定位元素，会画在流内内容之上；抬一层保证标记压住光晕 */
      position: relative;
      z-index: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      width: 96px;
      height: 96px;
      border-radius: 26px;
      background-image: var(--ypm-boot-gradient);
      box-shadow: 0 18px 44px -12px rgba(var(--ypm-boot-rgb), var(--ypm-boot-shadow-a));
      animation: ypm-boot-rise 560ms cubic-bezier(0.2, 0.8, 0.2, 1) backwards;
    }

    #ypm-boot-splash .ypm-boot-wave {
      display: block;
      width: 44px;
      height: 44px;
    }

    #ypm-boot-splash .ypm-boot-wave line {
      stroke: rgba(255, 255, 255, 0.95);
      stroke-width: 4;
      stroke-linecap: round;
      transform-box: fill-box;
      transform-origin: center;
      animation: ypm-boot-wave 1.1s ease-in-out infinite;
    }

    #ypm-boot-splash .ypm-boot-wave line:nth-child(2) {
      animation-delay: 120ms;
    }

    #ypm-boot-splash .ypm-boot-wave line:nth-child(3) {
      animation-delay: 240ms;
    }

    #ypm-boot-splash .ypm-boot-wave line:nth-child(4) {
      animation-delay: 360ms;
    }

    #ypm-boot-splash .ypm-boot-wave line:nth-child(5) {
      animation-delay: 480ms;
    }

    #ypm-boot-splash .ypm-boot-word {
      margin-top: 22px;
      /* letter-spacing 会在末字后多留 0.14em，用等量左内边距抵回来保持视觉居中 */
      padding-left: 0.14em;
      font-size: 15px;
      font-weight: 600;
      line-height: 1.4;
      letter-spacing: 0.14em;
      color: var(--ypm-boot-fg);
      opacity: 0.9;
      animation: ypm-boot-fade-up 560ms cubic-bezier(0.2, 0.8, 0.2, 1) 120ms
        backwards;
    }

    #ypm-boot-splash .ypm-boot-track {
      position: relative;
      width: 132px;
      height: 2px;
      margin-top: 26px;
      border-radius: 2px;
      background-color: var(--ypm-boot-track);
      overflow: hidden;
      animation: ypm-boot-fade-up 560ms cubic-bezier(0.2, 0.8, 0.2, 1) 200ms
        backwards;
    }

    #ypm-boot-splash .ypm-boot-bar {
      position: absolute;
      top: 0;
      left: 0;
      width: 44px;
      height: 2px;
      border-radius: 2px;
      background-image: var(--ypm-boot-gradient);
      animation: ypm-boot-sweep 1.35s cubic-bezier(0.65, 0, 0.35, 1) infinite;
    }

    /* 隐藏态：淡出 + 不再拦截点击 */
    #ypm-boot-splash.is-hidden {
      opacity: 0;
      pointer-events: none;
    }

    @keyframes ypm-boot-rise {
      from {
        opacity: 0;
        transform: translateY(10px) scale(0.94);
      }

      to {
        opacity: 1;
        transform: translateY(0) scale(1);
      }
    }

    @keyframes ypm-boot-fade-up {
      from {
        opacity: 0;
        transform: translateY(8px);
      }

      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    @keyframes ypm-boot-breathe {
      0%,
      100% {
        opacity: 0.55;
        transform: scale(1);
      }

      50% {
        opacity: 0.85;
        transform: scale(1.06);
      }
    }

    @keyframes ypm-boot-wave {
      0%,
      100% {
        transform: scaleY(0.55);
      }

      50% {
        transform: scaleY(1);
      }
    }

    @keyframes ypm-boot-sweep {
      from {
        transform: translateX(-44px);
      }

      to {
        transform: translateX(132px);
      }
    }

    @keyframes ypm-boot-fade {
      from {
        opacity: 0;
      }

      to {
        opacity: 1;
      }
    }

    /* 减弱动态效果：停掉所有循环动画，只保留淡入淡出 */
    @media (prefers-reduced-motion: reduce) {
      #ypm-boot-splash .ypm-boot-glow {
        animation: none;
        opacity: 0.7;
      }

      #ypm-boot-splash .ypm-boot-wave line {
        animation: none;
        transform: none;
      }

      #ypm-boot-splash .ypm-boot-bar {
        animation: none;
        transform: translateX(44px);
        opacity: 0.55;
      }

      #ypm-boot-splash .ypm-boot-mark,
      #ypm-boot-splash .ypm-boot-word,
      #ypm-boot-splash .ypm-boot-track {
        animation: ypm-boot-fade 240ms ease backwards;
      }

      #ypm-boot-splash {
        transition-duration: 200ms;
      }
    }
  </style>

  <script>
    /* 必须在 <body> 首次绘制前跑完：把主题色刷到 <html> 上，
       否则深色模式启动会先闪一下白底。同步执行，无 await。 */
    (function () {
      var appearance = 'light';
      var themeColor = 'default';
      try {
        var raw = localStorage.getItem('settings');
        if (raw) {
          var s = JSON.parse(raw);
          if (s && typeof s === 'object') {
            if (s.appearance) appearance = s.appearance;
            if (s.themeColor) themeColor = s.themeColor;
          }
        }
      } catch (e) {
        /* 隐私模式 / 脏数据：退回默认 */
      }
      if (appearance !== 'dark' && appearance !== 'light') {
        appearance =
          window.matchMedia &&
          window.matchMedia('(prefers-color-scheme: dark)').matches
            ? 'dark'
            : 'light';
      }
      var root = document.documentElement;
      root.setAttribute('data-boot-theme', appearance);
      root.setAttribute('data-boot-accent', themeColor);
      root.style.backgroundColor = appearance === 'dark' ? '#222222' : '#ffffff';
    })();
  </script>
</head>

<body>
  <div id="ypm-boot-splash" aria-hidden="true">
    <div class="ypm-boot-stack">
      <div class="ypm-boot-glow"></div>
      <div class="ypm-boot-mark">
        <svg class="ypm-boot-wave" viewBox="0 0 44 44" fill="none" aria-hidden="true" focusable="false">
          <line x1="6" y1="12" x2="6" y2="32" />
          <line x1="14" y1="9" x2="14" y2="35" />
          <line x1="22" y1="7" x2="22" y2="37" />
          <line x1="30" y1="9" x2="30" y2="35" />
          <line x1="38" y1="12" x2="38" y2="32" />
        </svg>
      </div>
      <div class="ypm-boot-word">YesPlayMusic</div>
      <div class="ypm-boot-track">
        <div class="ypm-boot-bar"></div>
      </div>
    </div>
  </div>

  <noscript>
    <style>
      /* 没有 JS 时启动页永远不会被移除，直接藏掉，别让用户看一个死转圈 */
      html {
        background: #ffffff !important;
      }

      body {
        padding: 32px;
      }

      #ypm-boot-splash {
        display: none !important;
      }
    </style>
    <strong>We're sorry but <%= htmlWebpackPlugin.options.title %> doesn't work
        properly without JavaScript enabled. Please enable it to
        continue.</strong>
  </noscript>
  <div id="app"></div>
  <!-- built files will be auto injected -->

  <script>
    (function () {
      var el = document.getElementById('ypm-boot-splash');
      if (!el) return;

      var MIN_MS = 900; /* 最短展示时间，避免闪电一闪 */
      var MAX_MS = 4000; /* 硬上限，接口再慢也要进去 */
      var FADE_MS = 460; /* 比 .is-hidden 的 420ms 过渡稍长，等淡出走完再摘节点 */
      var startedAt = Date.now();
      var done = false;

      window.__ypmHideSplash = function () {
        if (done || !el) return;
        done = true;
        el.classList.add('is-hidden');
        setTimeout(function () {
          if (el && el.parentNode) el.parentNode.removeChild(el);
          el = null;
          /* 清掉兜底底色，否则会盖住应用自己的背景 */
          document.documentElement.style.backgroundColor = '';
        }, FADE_MS);
      };

      var timer = setInterval(function () {
        var app = document.getElementById('app');
        /* 首页骨架屏（views/home.vue 的 .home-skeleton）还在，说明数据没回来。
           只靠文字长度不够：Navbar、「继续收听」首帧就有字，会误判成已就绪。
           这条是软依赖——类名不在了也只是退回「文字长度 + MAX_MS」。 */
        var skeleton = document.querySelector('.home-skeleton');
        var ready =
          app &&
          app.childElementCount > 0 &&
          !skeleton &&
          (app.textContent || '').trim().length > 60;
        var elapsed = Date.now() - startedAt;
        if ((ready && elapsed >= MIN_MS) || elapsed >= MAX_MS) {
          clearInterval(timer);
          window.__ypmHideSplash();
        }
      }, 100);
    })();
  </script>
</body>

</html>
